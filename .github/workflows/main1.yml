name: Build TEE Module + AnyKernel3
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl build-essential flex bison libssl-dev libelf-dev \
            zip lld bc cpio python3

      - name: Clone OnePlus SM8750-C16 kernel
        run: |
          git clone https://github.com/whitewhale0612/android_kernel_common_oneplus_sm8750-C16 kernel

      - name: Download Clang + GCC
        run: |
          # Clang
          curl -SL https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r15/clang-r510928.tar.gz | tar -xz -C $GITHUB_WORKSPACE
          mv $GITHUB_WORKSPACE/clang-r510928 $GITHUB_WORKSPACE/clang

          # GCC
          curl -SL https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-14.0.0_r15.tar.gz | tar -xz -C $GITHUB_WORKSPACE/gcc

      - name: Build kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH
          make LLVM=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CC=clang \
            LD=ld.lld \
            HOSTLD=ld.lld \
            oneplus_sm8750_defconfig

          make -j$(nproc) LLVM=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CC=clang \
            LD=ld.lld \
            HOSTLD=ld.lld

      - name: Build tz_tee_call module
        run: |
          mkdir -p module
          cp $GITHUB_WORKSPACE/tz_tee_call.c module/
          echo "obj-m += tz_tee_call.o" > module/Makefile

          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH
          make -j$(nproc) LLVM=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CC=clang \
            LD=ld.lld \
            HOSTLD=ld.lld \
            M=$GITHUB_WORKSPACE/module \
            modules

      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp $GITHUB_WORKSPACE/module/tz_tee_call.ko AK3/
          cd AK3
          zip -r9 TZ_TEE_CALL_AK3.zip ./*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RESULT
          path: |
            module/tz_tee_call.ko
            AK3/TZ_TEE_CALL_AK3.zip
