name: Build TEE Module + AnyKernel3
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout module
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git curl build-essential flex bison libssl-dev libelf-dev \
            zip lld bc cpio python3

      # 克隆你指定的内核
      - name: Clone OnePlus SM8750-C16 kernel
        run: |
          git clone https://github.com/whitewhale0612/android_kernel_common_oneplus_sm8750-C16 kernel

      # 安装工具链（clang-r510928 匹配这个内核）
      - name: Download clang
        run: |
          git clone https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r510928.git clang
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git gcc

      # 编译内核（必须完整编译，才能编模块）
      - name: Build kernel
        run: |
          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH
          make LLVM=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CROSS_COMPILE_ARM32=arm-linux-androideabi- \
            CC=clang \
            LD=ld.lld \
            HOSTLD=ld.lld \
            oneplus_sm8750_defconfig

          make -j$(nproc) LLVM=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CC=clang \
            LD=ld.lld \
            HOSTLD=ld.lld

      # 编译模块
      - name: Build tz_tee_call module
        run: |
          mkdir -p module
          cp $GITHUB_WORKSPACE/tz_tee_call.c module/
          echo "obj-m += tz_tee_call.o" > module/Makefile

          cd kernel
          export PATH=$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH
          make -j$(nproc) LLVM=1 \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            CC=clang \
            LD=ld.lld \
            HOSTLD=ld.lld \
            M=$GITHUB_WORKSPACE/module \
            modules

      # 打包 AnyKernel3
      - name: Pack AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp $GITHUB_WORKSPACE/module/tz_tee_call.ko AK3/
          cd AK3
          zip -r9 TZ_TEE_CALL_AK3.zip *

      - name: Upload module + AK3
        uses: actions/upload-artifact@v4
        with:
          name: OUTPUT
          path: |
            module/tz_tee_call.ko
            AK3/TZ_TEE_CALL_AK3.zip
