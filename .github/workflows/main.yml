name: Build TZ_TEE Module
on:
  workflow_dispatch:
    inputs:
      CPU:
        description: "CPU分支"
        required: true
        type: choice
        options:
          - 'sm8750'
          - 'mt6991'
          - 'sm8650'
          - 'mt6989'
          - 'sm8635'
          - 'sm8550'
          - 'sm8450'
          - 'sm8475'
          - 'sm7675'
          - 'sm7550'
          - 'sm6375'
        default: 'sm8750'
        
      FEIL:
        description: "手机型号"
        required: true
        type: choice
        options:
          - 'oneplus_13_b'
          - 'oneplus_13s_b'
          - 'oneplus_13t_b'  # 你的目标设备
          - 'oneplus_ace5_pro_b'
          - 'oneplus_ace_6'
          - 'oneplus_pad_2_pro_b'
          - 'oneplus_pad_3_b'
          - 'oneplus_ace5_ultra_b'
          - 'oneplus_12_b'
          - 'oneplus_ace3_pro_b'
          - 'oneplus_ace5_b'
          - 'oneplus_13r_b'
          - 'oneplus_pad2_b'
          - 'oneplus_pad_pro_b'
          - 'oneplus_ace5_race_b'
          - 'oneplus_ace5_race_v'
          - 'oneplus_nord_5_b'
          - 'oneplus_11_b'
          - 'oneplus_12r_b'
          - 'oneplus_ace2_pro_b'
          - 'oneplus_ace3_b'
          - 'oneplus_open_b'
          - 'oneplus_10t'
          - 'oneplus_11r_b'
          - 'oneplus_ace2_b'
          - 'oneplus_ace_pro'
          - 'oneplus_10_pro_v'
          - 'oneplus_ace_3v_b'
          - 'oneplus_nord_4_b'
          - 'oneplus_nord_ce4_lite_5g'
          - 'oneplus_nord_ce4_b'
        default: 'oneplus_13t_b'
        
      ANDROID_VERSION:
        description: "内核安卓KMI版本"
        required: true
        type: choice
        options:
          - 'android15'
          - 'android14'
          - 'android13'
          - 'android12'
        default: 'android14'
        
      KERNEL_VERSION:
        description: "内核版本"
        required: true
        type: choice
        options:
          - '6.6'
          - '6.1'
          - '5.15'
          - '5.10'
        default: '6.1'

jobs:
  build_module:
    name: Build TZ_TEE for ${{ github.event.inputs.FEIL }} (${{ github.event.inputs.KERNEL_VERSION }})
    runs-on: ubuntu-latest
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CCACHE_MAXSIZE: 8G
      
    steps:
      - name: "🚀 Maximize Build Space | 最大化构建空间"
        if: ${{ github.event.inputs.KERNEL_VERSION == '5.10' || github.event.inputs.KERNEL_VERSION == '5.15' }}
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: "⚙️ Setup Cache Env | 设置缓存环境"
        run: |
          echo "🔧 正在设置机型隔离缓存目录..."
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FEIL }}_Module" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FEIL }}_Module"
          echo "✅ 缓存目录已设置"

      - name: "🔐 Configure Git | 配置Git账户"
        run: |
          git config --global user.name "build"
          git config --global user.email "2210077278@qq.com"
          echo "✅ Git配置完成"

      - name: "📦 Cache & Install Dependencies | 缓存 & 安装构建依赖"
        uses: awalsh128/cache-apt-pkgs-action@latest 
        with: 
          packages: python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix
          execute_install_scripts: true

      - name: "💾 Restore ccache"
        uses: actions/cache@v3
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.event.inputs.FEIL }}-Module
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.event.inputs.FEIL }}-Module
            ccache-${{ runner.os }}-Module

      - name: "⚙️ Initialize ccache | 初始化ccache"
        run: |
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          if command -v ccache >/dev/null 2>&1; then
            if [ ! -f "$INIT_FLAG" ]; then
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              touch "$INIT_FLAG"
            fi
          fi
          ccache -s

      - name: "📥 Install Repo Tool | 安装Repo工具"
        run: |
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
          echo "✅ repo工具安装完成"

      - name: "⬇️ Clone Kernel Source | 克隆内核源码"
        run: |
          mkdir kernel_workspace && cd kernel_workspace

          # 初始化并同步内核源码
          repo init -u https://github.com/Xiaomichael/kernel_manifest.git -b refs/heads/oneplus/${{ github.event.inputs.CPU }} -m ${{ github.event.inputs.FEIL }}.xml --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle --force-sync
     
          # 清理不必要的文件
          rm kernel_platform/common/android/abi_gki_protected_exports_* || echo "No protected exports!"
          rm kernel_platform/msm-kernel/android/abi_gki_protected_exports_* || echo "No protected exports!"

          # 配置内核版本信息
          sed -i 's/ -dirty//g' kernel_platform/common/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i 's/ -dirty//g' kernel_platform/external/dtc/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/common/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/msm-kernel/scripts/setlocalversion
          sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' kernel_platform/external/dtc/scripts/setlocalversion
          
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" != "6.6" ]; then
            sed -i '$s|echo "\$res"|echo "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/common/scripts/setlocalversion            
            sed -i '$s|echo "\$res"|echo "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/msm-kernel/scripts/setlocalversion
            sed -i '$s|echo "\$res"|echo "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow"|' kernel_platform/external/dtc/scripts/setlocalversion
          else
            ESCAPED_SUFFIX=$(printf '%s\n' "-${{ github.event.inputs.ANDROID_VERSION }}-oki-xiaoxiaow" | sed 's:[\/&]:\\&:g')
            sudo sed -i "s/-4k/$ESCAPED_SUFFIX/g" kernel_platform/common/arch/arm64/configs/gki_defconfig
            sed -i 's/${scm_version}//' kernel_platform/common/scripts/setlocalversion
            sed -i 's/${scm_version}//' kernel_platform/msm-kernel/scripts/setlocalversion
          fi

          echo "✅ 内核源码克隆完成"

      - name: "⚙️ Generate Kernel Config | 生成内核配置"
        run: |
          cd kernel_workspace/kernel_platform/common
          
          # 根据内核版本设置工具链路径
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.1" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r487747c/bin:$PATH"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.6" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin:$PATH"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.15" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.10" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PATH"
          fi
          export PATH="/usr/lib/ccache:$PATH"
          
          # 生成内核配置文件（只生成.config，不编译内核）
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.10" ]; then
            make LLVM_IAS=1 LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" O=out gki_defconfig
          else
            make LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" O=out gki_defconfig
          fi
          
          # 启用模块编译所需的配置
          echo "CONFIG_MODULES=y" >> out/.config
          echo "CONFIG_MODULE_UNLOAD=y" >> out/.config
          echo "CONFIG_MODVERSIONS=y" >> out/.config
          echo "CONFIG_MODULE_SRCVERSION_ALL=y" >> out/.config
          
          # 应用配置
          make LLVM=1 ARCH=arm64 O=out olddefconfig
          
          echo "✅ 内核配置生成完成"

      - name: "📝 Create TZ_TEE Module File | 创建模块源码文件"
        run: |
          # 创建模块源码目录
          mkdir -p kernel_workspace/module
          
          # 写入模块源码（修复YAML语法：使用正确的缩进和引号）
          cat > kernel_workspace/module/tz_tee_call.c << EOF
#include <linux/module.h>
#include <linux/fs.h>
#include <linux/uaccess.h>
#include <linux/slab.h>
#include <linux/cdev.h>
#include <linux/capability.h>
#include <asm/barrier.h>
#include <asm/unistd.h>

#define DEVICE_NAME "tz_tee_call"
#define DEV_MAJOR   240
#define DEV_MINOR   0

// OnePlus 13T SM8750 TEE_InvokeTACommand 真实地址（MCP确认）
#define TEE_INVOKE_CMD_ADDR 0xd842430c
// 适配MCP的最大Payload长度（0x1B8+0x318+8=0x4D8，留冗余到0x1000）
#define MAX_PAYLOAD_LEN     0x1000

static struct cdev tz_tee_cdev;
static dev_t tz_tee_dev;

// 核心修复：安全调用TEE函数（保护寄存器/栈）
static noinline uint64_t tee_invoke_command(uint64_t session_handle,
                                           uint64_t cmd_id,
                                           uint64_t param_types,
                                           uint64_t param_attrs,
                                           uint64_t params,
                                           uint64_t return_origin) {
    // 1. 地址合法性校验（ARM64 4字节对齐）
    if (TEE_INVOKE_CMD_ADDR == 0 || (TEE_INVOKE_CMD_ADDR & 0x3) != 0) {
        pr_err("TZ_TEE: 无效TEE地址 0x%llx\\n", TEE_INVOKE_CMD_ADDR);
        return 0xFFFFFFFF;
    }

    // 2. 寄存器赋值（严格匹配TEE函数入参）
    register uint64_t x0 asm("x0") = session_handle;  // a1: 会话句柄
    register uint64_t x1 asm("x1") = cmd_id;          // a2: 命令ID
    register uint64_t x2 asm("x2") = param_types;     // a3: 参数类型
    register uint64_t x3 asm("x3") = param_attrs;     // a4: 参数属性
    register uint64_t x4 asm("x4") = params;          // a5: payload地址
    register uint64_t x5 asm("x5") = return_origin;   // a6: 返回原点
    register uint64_t lr asm("x30");                  // 保存返回地址

    uint64_t ret = 0xFFFFFFFF;

    // 3. 内联汇编调用（核心修复：保护栈/寄存器，避免TEE崩溃）
    asm volatile(
        "mov lr, #0\\n"                      // 清空LR，避免干扰TEE
        "mov x29, sp\\n"                     // 保存栈基址
        "blr %[tee_addr]\\n"                 // 调用TEE_InvokeTACommand
        "mov sp, x29\\n"                     // 恢复栈基址
        "mov %[ret], x0\\n"                  // 保存返回值
        : [ret] "=r"(ret)
        : [tee_addr] "r"(TEE_INVOKE_CMD_ADDR),
          "r"(x0), "r"(x1), "r"(x2), "r"(x3), "r"(x4), "r"(x5)
        : "memory", "x6", "x7", "x8", "x9", "x10", "x11",
          "x12", "x13", "x14", "x15", "x16", "x17", "x18",
          "x19", "x20", "x21", "x22", "x23", "x24", "x25",
          "x26", "x27", "x28", "x29", "x30", "cpsr"
    );

    pr_info("TZ_TEE: TEE调用返回 0x%llx (cmd_id=0x%llx)\\n", ret, cmd_id);
    return ret;
}

// 修复write函数：适配MCP的payload结构，增强稳定性
static ssize_t tz_tee_write(struct file *filp, const char __user *buf,
                           size_t len, loff_t *off) {
    uint64_t cmd_args[7];  // 入参：session/cmd/type/attr/params/return/len
    char *kernel_payload = NULL;
    size_t payload_len = 0;

    // 1. 权限校验（仅root可调用）
    if (!capable(CAP_SYS_ADMIN)) {
        pr_err("TZ_TEE: 无ROOT权限 (UID=%d)\\n", current_uid().val);
        return -EPERM;
    }

    // 2. 长度校验（适配MCP的payload长度）
    if (len < sizeof(cmd_args) || len > MAX_PAYLOAD_LEN) {
        pr_err("TZ_TEE: 无效长度 %zu (范围: %zu ~ %zu)\\n", 
               len, sizeof(cmd_args), MAX_PAYLOAD_LEN);
        return -EINVAL;
    }

    // 3. 拷贝用户参数（入参数组）
    if (copy_from_user(cmd_args, buf, sizeof(cmd_args))) {
        pr_err("TZ_TEE: 拷贝入参失败\\n");
        return -EFAULT;
    }

    // 4. 拷贝payload（核心溢出数据）
    payload_len = len - sizeof(cmd_args);
    kernel_payload = kzalloc(payload_len, GFP_KERNEL | GFP_DMA);  // 适配TEE内存
    if (!kernel_payload) {
        pr_err("TZ_TEE: 分配内核内存失败\\n");
        return -ENOMEM;
    }

    if (copy_from_user(kernel_payload, buf + sizeof(cmd_args), payload_len)) {
        pr_err("TZ_TEE: 拷贝payload失败\\n");
        kfree(kernel_payload);
        return -EFAULT;
    }

    // 5. 打印调试信息（方便定位问题）
    pr_info("TZ_TEE: 开始调用TEE函数\\n");
    pr_info("TZ_TEE: 会话=0x%llx, 命令ID=0x%llx, Payload长度=0x%zx\\n",
            cmd_args[0], cmd_args[1], payload_len);
    pr_info("TZ_TEE: TEE函数地址=0x%llx\\n", TEE_INVOKE_CMD_ADDR);

    // 6. 调用TEE函数（传递参数+payload地址）
    tee_invoke_command(
        cmd_args[0],  // session_handle (0x1)
        cmd_args[1],  // cmd_id (1109)
        cmd_args[2],  // param_types (0x0)
        cmd_args[3],  // param_attrs (0x0)
        (uint64_t)kernel_payload,  // payload地址
        cmd_args[5]   // return_origin (0x3)
    );

    // 7. 清理资源
    kfree(kernel_payload);
    return len;
}

// 文件操作结构体（补充release函数，避免资源泄漏）
static const struct file_operations tz_tee_fops = {
    .owner   = THIS_MODULE,
    .write   = tz_tee_write,
    .llseek  = no_llseek,
    .open    = nonseekable_open,
    .release = NULL,
};

// 模块初始化（增强错误处理）
static int __init tz_tee_init(void) {
    int ret = 0;

    // 校验TEE地址
    if (TEE_INVOKE_CMD_ADDR == 0) {
        pr_err("TZ_TEE: TEE函数地址未配置\\n");
        return -EINVAL;
    }

    // 注册字符设备
    tz_tee_dev = MKDEV(DEV_MAJOR, DEV_MINOR);
    ret = register_chrdev_region(tz_tee_dev, 1, DEVICE_NAME);
    if (ret < 0) {
        pr_err("TZ_TEE: 注册设备号失败 (ret=%d)\\n", ret);
        return ret;
    }

    // 初始化cdev
    cdev_init(&tz_tee_cdev, &tz_tee_fops);
    tz_tee_cdev.owner = THIS_MODULE;
    ret = cdev_add(&tz_tee_cdev, tz_tee_dev, 1);
    if (ret < 0) {
        pr_err("TZ_TEE: 添加设备失败 (ret=%d)\\n", ret);
        unregister_chrdev_region(tz_tee_dev, 1);
        return ret;
    }

    pr_info("TZ_TEE: 模块加载成功！TEE地址=0x%llx\\n", TEE_INVOKE_CMD_ADDR);
    pr_info("TZ_TEE: 设备节点: /dev/%s (主设备号=%d, 次设备号=%d)\\n",
            DEVICE_NAME, DEV_MAJOR, DEV_MINOR);
    return 0;
}

// 模块卸载（完整清理）
static void __exit tz_tee_exit(void) {
    cdev_del(&tz_tee_cdev);
    unregister_chrdev_region(tz_tee_dev, 1);
    pr_info("TZ_TEE: 模块卸载成功\\n");
}

module_init(tz_tee_init);
module_exit(tz_tee_exit);
MODULE_LICENSE("GPL");  // 必须GPL，否则内核拒绝加载
MODULE_DESCRIPTION("OnePlus 13T SM8750 TEE Exploit Module (适配0x1B8缓冲区)");
MODULE_VERSION("2.0");
EOF
          
          # 创建Makefile
          cat > kernel_workspace/module/Makefile << EOF
obj-m += tz_tee_call.o
KERNELDIR ?= ../kernel_platform/common
PWD := \$(shell pwd)

# 默认编译参数
EXTRA_CFLAGS += -Wall -Wextra -O2
EXTRA_CFLAGS += -DTZ_TEE_MODULE_BUILD

all:
	\$(MAKE) -C \$(KERNELDIR) M=\$(PWD) O=\$(KERNELDIR)/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC=clang LD=ld.lld modules

clean:
	\$(MAKE) -C \$(KERNELDIR) M=\$(PWD) O=\$(KERNELDIR)/out ARCH=arm64 clean
EOF
          
          echo "✅ 模块源码和Makefile创建完成"

      - name: "🔨 Build TZ_TEE Module | 编译模块"
        run: |
          cd kernel_workspace/module
          
          # 根据内核版本设置工具链
          if [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.1" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r487747c/bin:$PATH"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "6.6" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r510928/bin:$PATH"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.15" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts/clang/host/linux-x86/clang-r450784e/bin:$PATH"
          elif [ "${{ github.event.inputs.KERNEL_VERSION }}" == "5.10" ]; then
            export PATH="$GITHUB_WORKSPACE/kernel_workspace/kernel_platform/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin:$PATH"
          fi
          export PATH="/usr/lib/ccache:$PATH"
          
          # 安装必要依赖
          sudo apt install -y libelf-dev gcc-aarch64-linux-gnu
          
          # 编译模块
          make LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang"
          
          # 检查编译结果
          if [ -f "tz_tee_call.ko" ]; then
            echo "✅ 模块编译成功！"
            ls -la tz_tee_call.ko
            # 验证模块信息
            file tz_tee_call.ko
          else
            echo "❌ 模块编译失败！"
            exit 1
          fi

      - name: "📤 Upload Module | 上传模块文件"
        uses: actions/upload-artifact@v4
        with:
          name: tz_tee_call-${{ github.event.inputs.FEIL }}-${{ github.event.inputs.KERNEL_VERSION }}
          path: |
            kernel_workspace/module/tz_tee_call.ko
            kernel_workspace/module/tz_tee_call.c
            kernel_workspace/module/Makefile
